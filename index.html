function sprite(kind,crop,cls,parent){
  const [x,y,w,h]=crop;
  const [sw,sh]=kind===1?[1536,1024]:[2172,724];
  const el=put('div','','sprite '+cls,parent);
  el.setAttribute('aria-hidden','true');
  el.style.aspectRatio=w+'/'+h;
  el.style.backgroundImage='url("'+art[kind]+'")';
  el.style.backgroundSize=(sw/w*100)+'% '+(sh/h*100)+'%';
  el.style.backgroundPosition=(x/(sw-w)*100)+'% '+(y/(sh-h)*100)+'%';
  return el;
}
function drawVillage(interactive){
  const scene=put('div','','village-scene');
  const img=put('img','','',scene);

  img.src=art[0];
  state.work.forEach(i=>{
    const repair=repairs[i];
    const layer=sprite(2,repair.crop,'repair-art',scene);
    const [x,y,w]=repair.at;
    Object.assign(layer.style,{left:x+'%',top:y+'%',width:w+'%'});
  });
  if(state.done.includes(4))sceneProp(scene,[56.5,43,4,7],propArt.notice);
  if(interactive)stages.forEach((s,i)=>{
    const done=state.done.includes(i), open=unlocked(i);

    Object.assign(b.style,{left:x+'%',top:y+'%'});
  });
  return scene;
}

   btn('임무 시작',()=>go(stage===0?'office-route':'task'));return;
 }
 if(screen==='task'){
   const t=s.steps[step];put('p','임무 '+(step+1)+' / '+s.steps.length);put('h3',t.prompt);
   if(t.note&&stage!==2&&stage!==3)put('p',t.note,'record');
   if(t.search||t.caseOrder||t.caseEvidence){
     renderCase(t);
   }else if(t.inspect){
     const scene=drawVillage(false);
     const names=['아랫논','윗논','건넛논'];
     const plots=[[18,87,15,7],[22,63,11,6],[15,73,13,7]];
     t.cards.forEach((card,i)=>{
       if(!chosen.includes(i))sceneTarget(scene,names[i],plots[i],()=>{chosen.push(i);render();},true);
     });
     const records=put('div','','board cols');
     t.cards.forEach((card,i)=>put('div',chosen.includes(i)?card:names[i]+' · 조사 전','paper',records));
     if(chosen.length===t.cards.length)btn('조사 기록 확인',next);
   }else if(t.work){
     const scene=drawVillage(false);
     const props=[[71,76,10,11],[14,37,9,12],[80,71,10,10]];
     t.cards.forEach((card,i)=>{
       if(state.work.includes(i))return;
       sceneTarget(scene,card,props[i],()=>{state.work.push(i);save();render();},true,
         i===1?propArt.sack:i===2?propArt.seed:null);
     });
     renderVillage();
     if(state.work.length===t.cards.length)btn('확인 퀴즈',next);
   }else{
     const board=taskBoard();
     if(stage===4&&step===0&&graded){
       const scene=game.querySelector('.local-scene');
       const applyNotice=()=>{
         marker.remove();
         sceneProp(scene,marketWall,propArt.notice);
         const nextButton=btn('다음',next,game.querySelector('.viewport-actions')||game);
         nextButton.focus();
       };
       const marker=sceneTarget(scene,'흙벽에 방 붙이기',marketWall,applyNotice,true);
     }
     choices(t.cards,t.correct,()=>{graded=true;feedback='증거를 찾았어요.';render();},t.hint,board);
     if(graded&&!(stage===4&&step===0))btn(step===s.steps.length-1?'확인 퀴즈':'다음',next);
   }
 }else{
   const [question,options,correct,explanation]=s.quiz;
   const scene=questScene();
   const prompt=put('div','','dialogue',scene);
   put('h3','확인 퀴즈','',prompt);put('p',question,'',prompt);
   choices(options,correct,()=>{graded=true;feedback=explanation;render();},null,put('div','','board quiz-board'));
   if(graded)btn(stage===5?'재건 마무리':'임무 완료',complete);
 }
 const status=put('p',feedback,'status');status.setAttribute('role','status');
}

let documentPage=0;
function render(){
  renderContent();
  arrangeViewport();
}
function arrangeViewport(){
  game.dataset.screen=screen;
  const top=put('div','','viewport-heading');
  const body=put('div','','viewport-body');
  const actions=put('div','','viewport-actions');
  const original=[...game.children].filter(e=>![top,body,actions].includes(e));
  const scenes=original.filter(e=>e.matches('.village-scene,.local-scene,.quest-scene'));
  original.forEach(e=>{
    if(e.matches('h1,h2')||e.tagName==='H3'||(e.tagName==='P'&&!e.className))top.append(e);
    else if(e.tagName==='BUTTON'||e.matches('.status,.rebuilt,.bar'))actions.append(e);
    else body.append(e);
  });
  if(scenes.length){
    const scenic=put('div','','viewport-scenery',body);
    scenes.forEach(e=>scenic.append(e));
    const content=put('div','','viewport-content',body);
    [...body.children].filter(e=>e!==scenic&&e!==content).forEach(e=>content.append(e));
    if(!content.children.length)content.remove();
  }
  const files=game.querySelector('.case-files');
  if(files&&!stages[stage]?.steps[step]?.caseOrder){
    const cards=[...files.children];
    if(cards.length){
      documentPage=Math.min(documentPage,cards.length-1);
      cards.forEach((card,i)=>card.hidden=i!==documentPage);
      const nav=put('div','','document-pages',files.parentNode);
      btn('◂',()=>{documentPage=(documentPage+cards.length-1)%cards.length;render();},nav,'light').setAttribute('aria-label','이전 문서');
      put('span',(documentPage+1)+' / '+cards.length,'',nav);
      btn('▸',()=>{documentPage=(documentPage+1)%cards.length;render();},nav,'light').setAttribute('aria-label','다음 문서');
    }
  }
  if(screen==='task'&&stages[stage].steps[step].caseOrder){
    game.classList.add('timeline-screen');
    game.querySelectorAll('.case-doc').forEach(card=>{
      const read=btn('문서 읽기',event=>{
        event.stopPropagation();
        showDocument(card);
      },card,'read-document light');
      read.onpointerdown=event=>event.stopPropagation();
    });
  }
  sizeScenery();
}
function showDocument(card){
  const modal=document.createElement('dialog');modal.className='document-modal';
  const copy=card.cloneNode(true);copy.removeAttribute('role');copy.removeAttribute('tabindex');
  copy.querySelectorAll('button').forEach(e=>e.remove());
  modal.append(copy);btn('닫기',()=>modal.close(),modal,'light');
  modal.addEventListener('close',()=>modal.remove());document.body.append(modal);modal.showModal();
}
function sizeScenery(){
  game.querySelectorAll('.viewport-scenery').forEach(zone=>{
    const scene=zone.firstElementChild;
    if(!scene)return;
    const ratio=scene.classList.contains('village-scene')?1672/941:2;
    const width=Math.min(zone.clientWidth,zone.clientHeight*ratio);
    scene.style.width=width+'px';scene.style.height=width/ratio+'px';
  });
}
window.addEventListener('resize',sizeScenery);

let selectedDocument=null;
function drawCaseDocument(file,parent){
  const card=put('article','','case-doc',parent);
  put('time',file.date,'',card);put('h4',file.name,'',card);
  put('p',file.body,'',card);put('span',file.seal,'seal',card);
  return card;
}
function renderTimeline(task){
  put('p','네 장 중 박만복이 돈을 건넨 일부터 세금을 독촉한 일까지 이어지는 문서 세 장을 놓으세요. 남은 한 장은 다음 조사에 쓸 거예요.','record');
  put('p','문서 전체를 빈 칸으로 끌어 놓으세요. 문서를 누른 뒤 빈 칸을 눌러도 됩니다. 놓은 문서는 다시 누르면 아래로 돌아옵니다.');
  const slots=put('div','','board cols');
  function place(doc,index){
    if(graded||chosen[index]!=null||chosen.includes(doc))return;
    chosen[index]=doc;selectedDocument=null;feedback='';render();
  }
  for(let k=0;k<3;k++){
    const doc=chosen[k];
    if(doc==null){
      const slot=btn((k+1)+'. 문서를 놓을 자리',()=>{if(selectedDocument!=null)place(selectedDocument,k);},slots,'case-slot empty',graded);
      slot.dataset.caseSlot=k;
    }else{
      const slot=put('div',(k+1)+'. 배치한 문서','case-slot',slots);
      const card=drawCaseDocument(caseFiles[doc],slot);
      if(!graded){
        card.setAttribute('role','button');card.tabIndex=0;
        const remove=()=>{delete chosen[k];feedback='';render();};
        card.onclick=remove;
        card.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();remove();}};
      }
    }
  }
  const files=put('div','','case-files');
  caseFiles.forEach((file,doc)=>{
    if(chosen.includes(doc))return;
    const card=drawCaseDocument(file,files);
    if(graded)return;
    card.setAttribute('role','button');card.tabIndex=0;
    card.setAttribute('aria-pressed',String(selectedDocument===doc));
    if(selectedDocument===doc)card.dataset.picked='';
    const choose=()=>{selectedDocument=selectedDocument===doc?null:doc;render();game.querySelector('[data-picked]')?.focus();};
    card.onclick=choose;
    card.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose();}};
    card.onpointerdown=event=>{
      if(event.button!==0)return;
      const {pointerId,clientX:x,clientY:y}=event;
      let ghost;
      card.setPointerCapture(pointerId);
      card.onpointermove=move=>{
        if(!ghost&&Math.hypot(move.clientX-x,move.clientY-y)<7)return;
        if(!ghost){
          ghost=card.cloneNode(true);ghost.removeAttribute('tabindex');ghost.setAttribute('aria-hidden','true');
          ghost.classList.add('case-drag');ghost.style.width=Math.min(card.offsetWidth,320)+'px';document.body.append(ghost);
        }
        ghost.style.left=(move.clientX+10)+'px';ghost.style.top=(move.clientY+8)+'px';
      };
      const cleanup=()=>{ghost?.remove();card.onpointermove=null;card.onpointerup=null;card.onpointercancel=null;card.onlostpointercapture=null;};
      card.onpointercancel=cleanup;card.onlostpointercapture=cleanup;
      card.onpointerup=up=>{
        if(!ghost){cleanup();return;}
        const target=document.elementFromPoint(up.clientX,up.clientY)?.closest('[data-case-slot]');
        cleanup();card.onclick=null;
        setTimeout(()=>{card.onclick=choose;},0);
        if(target)place(doc,Number(target.dataset.caseSlot));
      };
    };
  });
  if(graded){btn('세금 액수 대조하기',next);return;}
  btn('배치 지우기',()=>{chosen=[];selectedDocument=null;feedback='';render();},game,'light',!chosen.some(Number.isInteger));
  btn('순서 확인',()=>{
    graded=chosen.join(',')==='1,2,0';
    feedback=graded?'5월 9일 거래 → 5월 21일 임명 → 6월 18일 독촉이 이어졌어요. 논세 기준 장부는 다음 조사에서 비교해요.':'세 사건을 기록한 문서를 골랐는지 확인하고, 문서의 날짜를 다시 읽어 보세요.';
    render();
  },game,'',chosen.filter(Number.isInteger).length!==3);
}
function renderCase(task){
  if(task.search){
    const scene=localScene(3);
    const points=[[27,77,9,20],[38,89,9,17],[88,75,10,18],[76,90,10,18]];
    points.forEach((point,i)=>{
      if(chosen.includes(i))return;
      const marker=sceneTarget(scene,'바닥에 떨어진 문서 '+(i+1),point,()=>{
        chosen.push(i);
        render();
        game.querySelector('.office-docs article:last-child')?.focus({preventScroll:true});
      },true,propArt.papers[i]);
      marker.style.setProperty('--rotation',[-13,9,-8,17][i]+'deg');
    });
    put('p','찾은 문서 '+chosen.length+'/'+caseFiles.length);
  }
  if(task.caseOrder){
    renderTimeline(task);
    return;
  }
  const files=put('div','',task.search?'case-files office-docs':'case-files');
  (task.search?chosen:caseFiles.map((_,i)=>i)).forEach(i=>{const file=caseFiles[i];
    if(task.search&&!chosen.includes(i))return;
    const card=put('article','','case-doc',files);
    put('time',file.date,'',card);put('h4',file.name,'',card);put('p',file.body,'',card);put('span',file.seal,'seal',card);
    if(task.search){card.tabIndex=-1;return;}
    const picked=chosen.includes(i);
    const button=btn(picked?'✓ 선택됨':task.caseOrder?'기록판에 놓기':'증거로 선택',()=>{
      if(picked)chosen=chosen.filter(n=>n!==i);
      else chosen.push(i);
      feedback='';render();
    },card,'answer paper',graded||(!picked&&chosen.length===(task.caseOrder?3:2)));
    button.setAttribute('aria-pressed',String(picked));
  });
  if(task.search){
    if(chosen.length===caseFiles.length)btn('사건 기록판 열기',next);
    return;
  }
  if(!graded){
    btn(task.caseOrder?'순서 확인':'증거 대조',()=>{
      graded=task.caseOrder?chosen.join(',')==='1,2,0':matching(chosen,[0,3]);
      feedback=task.caseOrder
        ?graded?'5월 9일 거래 → 5월 21일 임명 → 6월 18일 독촉이 이어졌어요.':'박만복이 돈을 건넨 날, 임명된 날, 세금을 독촉한 날을 다시 찾아보세요.'
        :graded?'같은 김두석의 논세가 두 자루에서 네 자루로 늘었어요. 박만복은 정해진 양보다 두 자루를 더 요구했어요.':'같은 사람에게 매긴 세금의 기준과 실제 요구량을 비교할 수 있는 두 문서를 찾아보세요.';
      render();
    },game,'',chosen.length!==(task.caseOrder?3:2));
  }else btn(task.caseOrder?'세금 액수 대조하기':'확인 퀴즈',next);
}
function renderVillage(){
  if(!state.work.length)return;
  const changes=['💧 논에 물이 흐릅니다','🍚 주민들이 곡식을 나눴습니다','🌱 다음 농사에 쓸 씨앗이 모였습니다'];
  put('p',state.work.map(i=>changes[i]).join(' · '),'rebuilt');
}
function openSceneDialogue(label,speaker,lines,startsMission){
  game.querySelector('.scene-dialogue')?.remove();
  const previous=document.activeElement;
  let line=0;
  const box=put('section','','scene-dialogue');
  box.setAttribute('role','region');box.setAttribute('aria-label',label+' 대화');
  const name=put('strong',lines.length>1?label:speaker,'',box);
  const text=put('p',lines[0],'',box);text.setAttribute('aria-live','polite');
  const controls=put('div','','bar',box);
  const close=()=>{box.remove();previous?.focus();};
  box.addEventListener('keydown',event=>{if(event.key==='Escape')close();});
  btn('닫기',close,controls,'light');
  if(startsMission){
    const advance=btn('다음 ▸',()=>{
      if(line===0){
         line++;name.textContent=speaker;text.textContent=lines[line];advance.textContent='임무 시작 ▸';
      }else go(stage===0?'office-route':'task');
    },controls);
    advance.focus();
  }else controls.querySelector('button')?.focus();
}
function localScene(index){
  const scene=put('div','','local-scene');
  scene.style.backgroundImage='url('+stagePanels+')';
  scene.style.backgroundPosition=(index%3*50)+'% '+(index<3?0:100)+'%';
  scene.setAttribute('role','group');scene.setAttribute('aria-label',stages[index].place+' 전경');
  return scene;
}
function questScene(){
  const scene=put('div','','quest-scene');
  const [x,y]=landmarks[stage];
  scene.style.backgroundImage='url('+art[0]+')';
  scene.style.backgroundPosition=x+'% '+y+'%';
  return scene;
}
function pin(scene,label,point,action,disabled,extra=''){
  const b=btn(label,action,scene,'landmark'+extra,disabled);
  Object.assign(b.style,{left:point[0]+'%',top:point[1]+'%'});
  return b;
}
const propArt={"papers": ["asset-6.webp", "asset-7.webp", "asset-8.webp", "asset-9.webp"], "sack": "asset-10.webp", "seed": "asset-11.webp", "notice": "asset-12.webp"};
const grainLedgerPosition=[36,83,13,19];
const exploreProps=[
 [[61,62,18,59],[90,77,15,27]],
 [[58,66,25,53],[79,77,15,29]],
 [grainLedgerPosition,[15,76,24,37]],
 [[62,61,15,16],[77,56,11,21]],
 [[65,52,42,45],[15,77,26,38]],
 [[65,48,34,41],[22,60,23,25]]
];
const marketWall=[65,53,17,36];
function locate(element,[x,y,w,h]){
 for(const [key,value] of Object.entries({x,y,w,h}))element.style.setProperty('--'+key,value+'%');
}
function sceneTarget(scene,label,position,action,active=false,artwork){
 const target=btn('',action,scene,'scene-target'+(active?' glint':''));
 locate(target,position);
 target.setAttribute('aria-label',label);
 if(artwork){
   const picture=put('img','','',target);picture.alt='';picture.src=artwork;
 }
 return target;
}
function sceneProp(scene,position,artwork){
 const picture=put('img','','scene-prop',scene);picture.alt='';picture.src=artwork;locate(picture,position);
}
function sackStack(parent,count){
 const stack=put('div','','sack-stack',parent);
 stack.setAttribute('aria-hidden','true');
 for(let i=0;i<count;i++){
   const sack=put('img','','',stack);sack.alt='';sack.src=propArt.sack;
 }
}
function taskBoard(){
  if(stage===2){
    const scale=localScene(2);scale.classList.add('scene-scale');
    const amounts=[2,3,5];
    const left=step===0?(amounts[chosen[0]]||0):2;
    const right=step===2?5:step===1?(amounts[chosen[0]]||0):0;
    sackStack(scale,left);sackStack(scale,right);
    sceneTarget(scale,'곡식 장부 열기',grainLedgerPosition,()=>openSceneDialogue('곡식 장부','곡식 장부',[grainLedger],false),true,propArt.papers[3]);
    put('p','저울 왼쪽 바닥에 있는 장부를 눌러 곡식의 양을 다시 확인할 수 있어요.','record');
    put('p','받은 양 '+left+'자루 · 갚을 양 '+right+'자루','record');
  }
  if(stage===3){
    const ledger=put('div','','ledger');
    const records=put('section','','',ledger);
    put('h4','주민 기록','',records);
    ['우물집 만석 · 7세','언덕집 만석 · 27세, 납부 대상','장터집 덕수 · 작년에 사망'].forEach(value=>put('p',value,'',records));
    const register=put('section','','',ledger);
    put('h4','군포 명단','',register);
    return register;
  }
  if(stage===4&&step>0){
    put('p','조선의 지역 위치를 단순하게 나타낸 그림','record');
    const history=put('div','','history');
    if(step===2)put('span','◆ 홍경래의 난','history-pin north',history);
    if(step===2&&graded)put('span','◆ 진주 농민 봉기','history-pin south',history);
    return history;
  }
  if(stage===1||stage===4||stage===5){
    localScene(stage);
    if(stage===5){
      const tray=put('div','','board cols',game);
      const records=['곡식 장부','군포 명단','논밭 장부'];
      records.forEach((name,i)=>{
        const filled=i<step||(i===step&&graded);
        const slot=put('div',filled?name:'빈 증거 칸','evidence-slot'+(filled?' filled':''),tray);
        put('small',filled?'암행어사에게 전달함':'증언에 맞는 기록을 고르세요','',slot);
      });
    }
  }
  return put('div','','board');
}
function choices(options,correct,onCorrect,hint,parent){
  const multi=correct.length>1;
  options.forEach((option,i)=>{
    const b=btn((chosen.includes(i)?'✓ ':'')+option,()=>{
      feedback='';
      if(multi)chosen=chosen.includes(i)?chosen.filter(n=>n!==i):[...chosen,i];
      else chosen=[i];
      render();game.querySelectorAll('.answer')[i]?.focus();
    },parent,'answer paper',graded);
    b.setAttribute('aria-pressed',String(chosen.includes(i)));
  });
  if(!graded)btn('확인',()=>{
    if(matching(chosen,correct))onCorrect();
    else{feedback=hint||'주민의 이야기와 기록을 떠올려 다시 골라 보세요.';render();game.querySelector('.answer')?.focus();}
  },game,'',!chosen.length);
}
render();
