<script>const app = document.querySelector('#app');
const storageKey = 'joseon-history-scenes-nine';
let records = {};
try {
  const saved = localStorage.getItem(storageKey);
  const six = localStorage.getItem('joseon-history-scenes-chronological');
  const seven = localStorage.getItem('joseon-history-scenes-seven');
  if (saved) records = JSON.parse(saved) || {};
  else if (seven) {
    const previous = JSON.parse(seven) || {};
    const previousOrder = ["EP1-2","EP1-7","EP1-3","EP1-4","EP1-5","EP1-6","EP1-1"];
    lessons.forEach((lesson, index) => {
      const oldIndex = previousOrder.indexOf(lesson.ep);
      if (oldIndex !== -1 && previous[oldIndex]) records[index] = previous[oldIndex];
    });
  } else if (six) {
    const previous = JSON.parse(six) || {};
    const previousOrder = ["EP1-2","EP1-3","EP1-4","EP1-5","EP1-6","EP1-1"];
    lessons.forEach((lesson, index) => {
      const oldIndex = previousOrder.indexOf(lesson.ep);
      if (oldIndex !== -1 && previous[oldIndex]) records[index] = previous[oldIndex];
    });
  } else {
    const previous = JSON.parse(localStorage.getItem('joseon-history-scenes-ep1') || '{}') || {};
    const original = JSON.parse(localStorage.getItem('joseon-history-scenes-v1') || '{}') || {};
    lessons.forEach((lesson, index) => {
      const clipIndex = Number(lesson.ep.split('-')[1]) - 1;
      const old = previous[clipIndex] || (clipIndex === 0 ? original[0] : undefined);
      if (clipIndex < 6 && old) records[index] = {answer:old.answer, done:old.done};
    });
  }
} catch {}
function update(index, patch) {
  records[index] = {...records[index], ...patch};
  try { localStorage.setItem(storageKey, JSON.stringify(records)); return true; } catch { return false; }
}
const url = id => 'https://www.youtube.com/watch?v=' + id;
const timeline = [
  ['1871','신미양요','미국군이 강화도를 공격하고 조선군이 맞섰어요.',5],
  ['1876','강화도 조약','일본의 압박 속에서 조선은 조약을 맺고 항구를 열었어요.',10],
  ['1897','대한제국 선포','고종이 대한제국을 선포하고 황제가 되었어요.'],
  ['1905','을사늑약','일본이 조약을 강요해 대한제국의 외교권을 빼앗았어요.']
];
const chapters = [
  {title:'유진 초이, 그는 누구인가?', start:0, end:9},
  {title:'개항 이후의 조선, 그녀의 삶', start:9, end:lessons.length}
];
function cards() {
  const done = lessons.filter((_, i) => records[i]?.done).length;
  return `<h2>챕터 목록</h2><p>장면 학습 완료 ${done} / ${lessons.length}</p><progress aria-label="완료한 장면 수" value="${done}" max="${lessons.length}"></progress>${chapters.map((chapter, ci)=>`
    <section class="chapter-group" id="chapter-${ci+1}" tabindex="-1"><h3>챕터 ${ci+1}. ${chapter.title}</h3><div class="cards">${lessons.slice(chapter.start,chapter.end).map((l, offset)=>{
      const i = chapter.start + offset;
      return `<article class="card"><div><p class="badge">장면 ${offset+1} · ${l.ep}${records[i]?.done?' · 완료':''}</p><h4>${l.name}</h4><p class="muted">${l.topic} · 약 ${l.minutes}분</p></div><a class="button" aria-label="${l.name} 열기" href="#lesson-${i+1}">학습하기</a></article>`;
    }).join('')}</div></section>`).join('')}`;
}
function lesson(index) {
  const l = lessons[index];
  const ci = chapters.findIndex(chapter => index < chapter.end);
  const chapter = chapters[ci];
  const questions = [l, ...(l.extraQuiz || [])];
  app.innerHTML = `<div class="heading"><p class="badge">챕터 ${ci+1} · 장면 ${index-chapter.start+1} · ${l.topic} · 약 ${l.minutes}분</p><h1 tabindex="-1">${l.name}</h1><p>${l.title}</p></div>
  <div class="stack"><div class="split"><section class="panel" aria-labelledby="before"><h2 id="before">보기 전 알아두기</h2><h3>어떤 장면인가요?</h3><div class="narration">${l.scene.map(line=>`<p>${line}</p>`).join("")}</div><ul>${l.before.map(([key,value])=>`<li><strong>${key}</strong> · ${value}</li>`).join('')}</ul><h3 style="margin-top:1rem">이것을 찾아보세요</h3><p>${l.watch}</p></section>
  <figure class="panel"><figcaption><p class="badge">tvN DRAMA · ${l.ep}</p><h2>${l.title}</h2></figcaption>
  ${l.review?`<p>영상에 다음 내용이 나와요. ${l.review}. 교사와 함께 확인하거나 읽을거리로 학습할 수 있어요.</p>`:""}
  <div id="video"></div><a href="${url(l.id)}" target="_blank" rel="noopener">YouTube에서 보기</a>
  </figure></div>
  <section class="panel"><h2>내용 확인</h2><div class="${l.portrait ? 'quiz-with-portrait' : ''}"><div>${questions.map((q, qi)=>`<div class="quiz-item${q.image ? ' quiz-with-portrait' : ''}" data-quiz="${qi}" role="group" aria-labelledby="question-${qi}"><div><p id="question-${qi}">${questions.length > 1 ? (qi + 1) + '. ' : ''}${q.quiz}</p><div class="row">${q.options.map((option,i)=>`<button type="button" aria-pressed="false" data-option="${i}">${option}</button>`).join('')}</div><p class="feedback" role="status"></p></div>${q.image ? `<figure class="character-card quiz-scene"><img src="${q.image.src}" alt="${q.image.alt}" width="626" height="470"><figcaption>추노꾼 · tvN 《미스터 션샤인》</figcaption></figure>` : ''}</div>`).join('')}</div>${l.portrait?`<figure class="character-card"><div class="character-image"><img src="${l.portrait.src}" alt="드라마에서 ${l.portrait.name}(으)로 등장하는 인물" loading="lazy"></div><figcaption><strong>${l.portrait.name}</strong><br><small>tvN DRAMA · ${l.ep} 공식 썸네일</small></figcaption></figure>`:''}</div></section>
  <section class="panel"><h2>실제 역사와 드라마</h2><div class="fact"><div><h3>실제 역사</h3><p>${l.real}</p><a href="${l.source}" target="_blank" rel="noopener">${l.sourceLabel || '역사 자료 읽기'}</a></div><div><h3>드라마 속 이야기</h3><p>${l.drama}</p></div></div></section>
  <section class="panel"><h2><label for="answer">내 생각 쓰기</label></h2><p id="prompt">${l.question}</p><details><summary>문장 시작 도움말</summary><p>“나는 ___ 장면을 보고, 이 인물이 ___하려 했다고 생각했다.” 또는 “나는 ___라고 생각한다. 그 까닭은 ___이다.”</p></details><textarea id="answer" aria-describedby="prompt" placeholder="장면이나 읽을거리에서 찾은 단서 하나를 넣어 써 보세요."></textarea><p id="saved" role="status"></p><button class="primary" id="complete">학습 완료</button></section>
  <div class="row"><a class="button" href="${index ? '#lesson-'+index : '#chapters'}">${index?'이전 장면':'챕터 목록'}</a><a class="button" href="${index+1<lessons.length?'#lesson-'+(index+2):'#chapters'}">${index+1<lessons.length?'다음 장면':'챕터 목록으로'}</a></div></div>`;
  const video = document.querySelector('#video');
  const mount = () => {
    if (video.firstChild) return;
    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + l.id;
    iframe.title = 'tvN DRAMA 공식 클립 ' + l.ep;
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    video.append(iframe);
  };
  mount();
  document.querySelectorAll('[data-quiz]').forEach((group, qi) => {
    const q = questions[qi];
    const options = [...group.querySelectorAll('[data-option]')];
    const showChoice = choice => {
      options.forEach((button,i)=>button.setAttribute('aria-pressed',i===choice));
      group.querySelector('.feedback').textContent = (choice===q.correct?'맞았어요. ':'이렇게 알아두세요. ') + q.explain;
    };
    const saved = qi === 0 ? records[index]?.choice : records[index]?.extraChoices?.[qi];
    if (Number.isInteger(saved)) showChoice(saved);
    options.forEach((button,i)=>button.onclick=()=>{
      const patch = qi === 0 ? {choice:i} : {extraChoices:{...records[index]?.extraChoices,[qi]:i}};
      update(index,patch);
      showChoice(i);
    });
  });
  const answer = document.querySelector('#answer');
  const status = document.querySelector('#saved');
  const complete = document.querySelector('#complete');
  answer.value = records[index]?.answer || '';
  if (records[index]?.done) complete.textContent = '학습 완료됨';
  answer.oninput = () => { if (!update(index,{answer:answer.value})) status.textContent = '이 브라우저에서 저장을 사용할 수 없어요.'; };
  complete.onclick = () => {
    const saved = update(index,{answer:answer.value,done:true});
    complete.textContent = '학습 완료됨';
    status.textContent = saved?'완료 표시와 내 생각을 이 브라우저에 저장했어요.':'이 브라우저에서 저장을 사용할 수 없어요.';
  };
}
function render() {
  const route = location.hash.slice(1);
  const match = /^lesson-(\d+)$/.exec(route);
  if (match && Number(match[1]) >= 1 && Number(match[1]) <= lessons.length) lesson(Number(match[1])-1);
  else if (route==='timeline') app.innerHTML = `<section class="panel"><h1 tabindex="-1">시대 흐름</h1><ol class="timeline">${timeline.map(([year,event,desc,index])=>`<li><strong>${year}년 · ${event}</strong><p>${desc}</p>${index ? `<a href="#lesson-${index}">관련 장면 열기</a>` : ""}</li>`).join('')}</ol></section>`;
  else if (route==='teacher') app.innerHTML = `<section class="panel"><h1 tabindex="-1">교사용 영상 검토</h1><h2>챕터 제작 원칙</h2><ul><li><strong>보기 전</strong>에는 시대 배경과 어려운 낱말, 관찰할 단서를 안내합니다. 장면 소개나 관찰 안내에서 내용 확인의 정답을 먼저 밝히지 않습니다.</li><li><strong>보기 후</strong>에는 영상 속 말, 행동, 옷차림 등 학생이 직접 보고 들은 사실을 묻습니다. 해설에서는 답의 근거를 짚어 줍니다.</li><li>챕터는 이야기 속 시간 순서로 배열하고, 영상에는 공식 클립 번호를 표시합니다.</li></ul><p>공식 업로드와 회차를 확인한 영상입니다. 학생에게 공유하기 전에 실제 재생 환경에서 장면 전체 및 학교 기기 재생을 확인해 주세요.</p><ul>${lessons.map(l=>`<li><a href="${url(l.id)}" target="_blank" rel="noopener">${l.ep} · ${l.title}</a> — ${l.review?'교사 동반 권장 · '+l.review:'장면 전체와 재생 가능 여부 확인 필요'}</li>`).join('')}</ul></section>`;
  else app.innerHTML = `<section class="hero"><p class="stamp">초등 사회 · 자기주도 역사 탐구</p><h1 tabindex="-1">유진 초이,<br>그는 누구인가?</h1><p>1871년 조선, 한 소년의 이야기가 시작됩니다. 어린 유진을 따라 그날의 조선으로 들어가 볼까요?</p><p>영상을 보기 전에 그 시대를 먼저 만나 보세요. 배경을 알고 보면 인물의 말과 행동이 다르게 보입니다.</p><a class="button" href="#lesson-${(lessons.findIndex((_,i)=>!records[i]?.done)+1)||1}">학습 시작</a></section><section class="heading" id="chapters" tabindex="-1">${cards()}</section>`;
  const focus = route==='chapters'? document.querySelector('#chapters'):app.querySelector('h1');
  if(route) focus?.focus({preventScroll:true});
  if(route==='chapters') focus?.scrollIntoView(); else window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
