<style>
:root{color-scheme:light;--ink:#182c45;--paper:#fbf6e9;--line:#ded3bc;--card:#fffdf7;--green:#22574b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif}header,footer{border-block-end:1px solid var(--line)}nav,main,footer>div{max-width:1152px;margin:auto;padding:1rem clamp(1rem,4vw,2.5rem)}nav{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}nav span{display:flex;gap:1rem;flex-wrap:wrap}a{color:#1f5349;text-underline-offset:.22em}h1,h2,h3,p{margin:0 0 .65rem}h1,.hero h2{font-family:"Batang",serif;font-weight:700;line-height:1.2;font-size:clamp(2.15rem,5.5vw,4.1rem);letter-spacing:-.05em}.hero{padding:clamp(1.5rem,5vw,4rem);border-radius:1.35rem;background:#172d43;color:#fff8e8;position:relative;overflow:hidden}.hero p{max-width:36rem;color:#eee2cb}.hero a{color:#13263f;background:#f1dfb5;border:none}.hero .stamp{color:#efd59b;font-weight:700}.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}.cards{margin-top:1.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr));gap:.85rem}.card,.panel{border:1px solid var(--line);background:var(--card);border-radius:1rem;padding:1.15rem}.card{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.muted{color:#4e5961}.badge{color:var(--green);font-weight:700;font-size:.9rem}.button,button{display:inline-block;padding:.56rem .95rem;border:1px solid #b4bcb2;background:var(--card);color:var(--ink);border-radius:.6rem;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--green);border-color:var(--green);color:white}button[aria-pressed=true]{background:#daeadd;border-color:var(--green)}:focus-visible{outline:3px solid #9a531a;outline-offset:3px}.split,.fact{display:grid;gap:1rem}.split{grid-template-columns:1fr 1fr;align-items:start}.fact{grid-template-columns:1fr 1fr}.stack{display:grid;gap:1rem}.heading{margin:1rem 0}.heading h1{font-size:clamp(1.8rem,4vw,3rem)}ul{margin:.3rem 0;padding-left:1.3rem}li+li{margin-top:.35rem}figure{margin:0}iframe{border:0;width:100%;aspect-ratio:16/9;border-radius:.65rem;background:#14273b}details{margin:.7rem 0}summary{cursor:pointer;font-weight:700}textarea{display:block;width:100%;min-height:6rem;padding:.7rem;border:1px solid #a9a99e;border-radius:.5rem;font:inherit}ol.timeline{list-style:none;padding:0;border-left:3px solid #aa8350;margin-left:.6rem}ol.timeline li{padding:.75rem 1rem;border-bottom:1px solid var(--line)}footer{border-block-start:1px solid var(--line);margin-top:1rem}main{min-height:70vh}#feedback{margin:.5rem 0;color:#234f42}progress{accent-color:var(--green);width:min(100%,16rem)}@media(max-width:720px),(orientation:portrait) and (max-width:1100px){.split{grid-template-columns:1fr}}@media(max-width:480px){.fact{grid-template-columns:1fr}}
</style>

<footer><div><a href="#teacher">교사용 영상 검토</a> · <a href="https://www.youtube.com/playlist?list=PLdyB3s37qpTP0mLUOcpb3iV_SSTYB9mox" target="_blank" rel="noopener">tvN DRAMA 공식 재생목록</a></div></footer>
<script>const historySource = 'https://contents.history.go.kr/';
const lessons = [
  {
    name:'조선은 어떤 나라였을까?', topic:'신분제 · 유진의 귀환', minutes:8,

    source:historySource+'mobile/ta/view.do?levelId=ta_h51_0060_0030_0010',

    explain:'유진은 미국에서 살다가 미국 군인이 되어 조선으로 돌아와요.',
    question:'유진에게 조선은 어떤 곳이었을까요? 그가 조선에서 태어났다는 사실과 미국 군인이 되어 돌아온다는 사실을 함께 생각해 보세요.'
  },
  {"id":"SQvkNjBdEEs","name":"어머니는 왜 유진을 떠나보내려 했을까?","topic":"신분제와 어린 유진","title":"어머니는 왜 유진을 떠나보내려 했을까?","scene":"어린 유진의 어머니가 위험에 처한 아들을 살리려 애써요. 앞 영상의 어른 유진보다 시간이 앞선 장면이에요.","before":[["노비","조선에서 개인이나 관청에 매여 일하던 신분이에요."]],"watch":"어머니의 말과 표정에서 유진에게 바라는 행동을 찾아봐요.","real":"조선에는 노비 제도가 있었고, 신분에 따라 대우가 달랐어요.","drama":"유진과 어머니의 이야기는 드라마의 설정이에요.","quiz":"이 장면에서 유진은 어떤 때의 모습인가요?","options":["어린 시절","미국 군인이 된 뒤","조선에 돌아온 뒤"],"correct":0,"explain":"앞 장면에서 시간을 거슬러 어린 유진을 보여 줘요.","question":"어머니가 유진을 살리려 한다는 것을 보여 주는 단서는 무엇인가요?","review":"가족이 위험에 처하는 장면","source":"https://contents.history.go.kr/mobile/ta/view.do?levelId=ta_h51_0060_0030_0010","ep":"EP1-2","minutes":8},
  {"id":"sb9ZGrfX02E","name":"강화도에서 무슨 일이 일어났을까?","topic":"신미양요와 강화도","title":"강화도에서 무슨 일이 일어났을까?","scene":"미국군이 강화도의 군사 시설을 공격하고 조선군이 맞서요.","before":[["신미양요","1871년 미국군이 강화도를 공격하고 조선군이 맞서 싸운 사건이에요."]],"watch":"바다와 육지에 각각 누가 있는지 살펴봐요.","real":"미국군은 강화도의 광성보 등을 공격했고, 어재연이 이끄는 조선군이 맞섰어요.","drama":"화면 속 전투 모습과 대사는 드라마가 재구성했어요.","quiz":"미국군이 공격한 곳은 어디인가요?","options":["강화도","제주도","울릉도"],"correct":0,"explain":"신미양요 때 미국군은 강화도의 여러 군사 시설을 공격했어요.","question":"조선의 군사 시설이 강화도의 바닷길 가까이에 있었던 이유를 생각해 봐요.","review":"전투 장면","source":"https://contents.history.go.kr/mobile/kc/view.do?levelId=kc_i303800","ep":"EP1-3","minutes":8},
  {"id":"5bTDwPQIf4A","name":"조선군은 왜 자리를 지키려 했을까?","topic":"강화도 전투에 참여한 사람들","title":"조선군은 왜 자리를 지키려 했을까?","scene":"위험에 처한 조선군이 자신들이 맡은 곳을 지키려 해요.","before":[["수비","공격을 막고 맡은 곳을 지키는 일이에요."]],"watch":"조선군의 말에서 이들이 무엇을 지키려 하는지 찾아봐요.","real":"신미양요 때 조선군은 광성보에서 미국군과 싸웠고 많은 희생을 치렀어요.","drama":"등장인물의 대화와 선택은 드라마가 재구성한 장면이에요.","quiz":"영상에서 조선군이 지키려 한 곳은 어디인가요?","options":["강화도의 진지","서울의 호텔","미국의 항구"],"correct":0,"explain":"조선군은 강화도에서 자신들이 맡은 진지를 지키려 해요.","question":"인물은 왜 위험을 무릅쓰고 자리를 지키려 했을까요? 말이나 행동 하나를 근거로 써 보세요.","review":"전투와 희생을 다루는 장면","source":"https://contents.history.go.kr/mobile/kc/view.do?levelId=kc_i303800","ep":"EP1-4","minutes":8},
  {"id":"uocAnDJ1WeY","name":"전투가 끝나면 모두에게 끝일까?","topic":"대원군과 포로","title":"전투가 끝나면 모두에게 끝일까?","scene":"전투 이후 대원군이 상황을 바라보는 모습과 붙잡힌 조선 사람들의 처지가 나와요.","before":[["포로","전투에서 상대편에게 붙잡힌 사람이에요."]],"watch":"대원군과 포로가 전투 이후 어떤 상황에 놓였는지 비교해 봐요.","real":"흥선대원군은 고종의 아버지이자 실제 인물이에요. 신미양요 당시 미국과 조선은 조약을 맺지 않았어요.","drama":"영상에서 대원군이 한 말과 포로들의 구체적인 이야기는 드라마의 재구성이에요.","quiz":"전투에서 상대편에 붙잡힌 사람을 무엇이라 하나요?","options":["포로","통역관","상인"],"correct":0,"explain":"전투에서 상대편에게 붙잡힌 사람을 포로라고 해요.","question":"전투가 끝났다는 소식을 대원군과 포로가 어떻게 다르게 받아들였을까요?","review":"전투 직후와 포로를 다루는 장면","source":"https://contents.history.go.kr/mobile/kc/view.do?levelId=kc_i303800","ep":"EP1-5","minutes":8},
  {"id":"PNPEwruZCw4","name":"붙잡힌 사람들은 어떤 마음이었을까?","topic":"이완익의 말과 포로의 처지","title":"붙잡힌 사람들은 어떤 마음이었을까?","scene":"이완익이 붙잡힌 조선 사람들에게 거친 말을 해요. 그 말을 들은 사람들의 입장에서 생각해 봐요.","before":[["전투 이후의 삶","전투가 끝나도 포로와 가족의 어려움은 이어질 수 있어요."]],"watch":"이완익의 말에 포로들이 어떤 표정과 반응을 보이는지 살펴봐요.","real":"1871년 강화도에서 조선군과 미국군이 싸운 신미양요는 실제 사건이에요.","drama":"이완익이 포로와 나누는 대화는 드라마가 구성한 장면이에요.","quiz":"이완익의 말을 듣는 사람들은 어떤 처지인가요?","options":["전투 뒤 상대에게 붙잡혀 있어요.","새로운 물건을 사러 왔어요.","미국에 공부하러 가고 있어요."],"correct":0,"explain":"이 장면 속 사람들은 전투 뒤에 붙잡힌 조선 사람들이에요.","question":"이완익의 말을 들은 포로들은 어떤 마음이었을까요? 표정이나 행동 하나를 단서로 써 보세요.","review":"포로에게 하는 거친 말","source":"https://contents.history.go.kr/mobile/kc/view.do?levelId=kc_i303800","ep":"EP1-6","minutes":8}
];
</script>
<script>const app = document.querySelector('#app');
const storageKey = 'joseon-history-scenes-ep1';
let records = {};
try {
  const saved = localStorage.getItem(storageKey);
  const first = JSON.parse(localStorage.getItem('joseon-history-scenes-v1') || '{}')?.[0];
  records = saved ? JSON.parse(saved) || {} : first ? {0:first} : {};
} catch {}
function update(index, patch) {
  records[index] = {...records[index], ...patch};
  try { localStorage.setItem(storageKey, JSON.stringify(records)); return true; } catch { return false; }
}
const url = id => 'https://www.youtube.com/watch?v=' + id;
const timeline = [
  ['1871','신미양요','미국군이 강화도를 공격하고 조선군이 맞섰어요.',3],
  ['1876','강화도 조약','일본의 압박 속에서 조선은 조약을 맺고 항구를 열었어요.'],
  ['1897','대한제국 선포','고종이 대한제국을 선포하고 황제가 되었어요.'],
  ['1905','을사늑약','일본이 조약을 강요해 대한제국의 외교권을 빼앗았어요.']
];
function cards() {
  const done = lessons.filter((_, i) => records[i]?.done).length;
  return '<h2>'+'챕터 목록'+'</h2><p>학습 완료 '+done+' / '+lessons.length+'</p><progress aria-label="완료한 챕터 수" value="'+done+'" max="'+lessons.length+'"></progress><div class="cards">'+lessons.map((l,i)=>`
    <article class="card"><div><p class="badge">챕터 ${i+1} · ${l.ep}${records[i]?.done?' · 완료':''}</p><h3>${l.name}</h3><p class="muted">${l.topic} · 약 ${l.minutes}분</p></div><a class="button" aria-label="${l.name} 열기" href="#lesson-${i+1}">학습하기</a></article>`).join('')+'</div>';
}
function lesson(index) {
  const l = lessons[index];
  app.innerHTML = `<div class="heading"><p class="badge">챕터 ${index+1} · ${l.topic} · 약 ${l.minutes}분</p><h1 tabindex="-1">${l.name}</h1><p>${l.title}</p></div>
  <div class="stack"><div class="split"><section class="panel" aria-labelledby="before"><h2 id="before">보기 전 알아두기</h2><h3>어떤 장면인가요?</h3><p>${l.scene}</p><ul>${l.before.map(([key,value])=>`<li><strong>${key}</strong> · ${value}</li>`).join('')}</ul><h3 style="margin-top:1rem">이것을 찾아보세요</h3><p>${l.watch}</p></section>
  <figure class="panel"><figcaption><p class="badge">tvN DRAMA · ${l.ep}</p><h2>${l.title}</h2></figcaption>
  ${l.review?`<p>영상에 다음 내용이 나와요. ${l.review}. 교사와 함께 확인하거나 읽을거리로 학습할 수 있어요.</p><details><summary>교사와 함께 영상 열기</summary><div id="video"></div><a href="${url(l.id)}" target="_blank" rel="noopener">YouTube에서 보기</a></details>`:`<div id="video"></div><a href="${url(l.id)}" target="_blank" rel="noopener">YouTube에서 보기</a>`}
  </figure></div>
  <section class="panel"><h2>실제 역사와 드라마</h2><div class="fact"><div><h3>실제 역사</h3><p>${l.real}</p><a href="${l.source}" target="_blank" rel="noopener">역사 자료 읽기</a></div><div><h3>드라마 속 이야기</h3><p>${l.drama}</p></div></div></section>
  <section class="panel"><h2>내용 확인</h2><p>${l.quiz}</p><div class="row" id="options">${l.options.map((option,i)=>`<button type="button" aria-pressed="false" data-option="${i}">${option}</button>`).join('')}</div><p id="feedback" role="status"></p></section>
  <section class="panel"><h2><label for="answer">내 생각 쓰기</label></h2><p id="prompt">${l.question}</p><details><summary>문장 시작 도움말</summary><p>“나는 ___ 장면을 보고, 이 인물이 ___하려 했다고 생각했다.” 또는 “나는 ___라고 생각한다. 그 까닭은 ___이다.”</p></details><textarea id="answer" aria-describedby="prompt" placeholder="장면이나 읽을거리에서 찾은 단서 하나를 넣어 써 보세요."></textarea><p id="saved" role="status"></p><button class="primary" id="complete">학습 완료</button></section>
  <div class="row"><a class="button" href="${index ? '#lesson-'+index : '#chapters'}">${index?'이전 챕터':'챕터 목록'}</a><a class="button" href="${index+1<lessons.length?'#lesson-'+(index+2):'#chapters'}">${index+1<lessons.length?'다음 챕터':'챕터 목록으로'}</a></div></div>`;
  const video = document.querySelector('#video');
  const mount = () => {
    if (video.firstChild) return;
    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + l.id;
    iframe.title = 'tvN DRAMA 공식 클립 ' + l.ep;
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    video.append(iframe);
  };
  if (l.review) video.closest('details').addEventListener('toggle',event=>{if(event.currentTarget.open) mount();});
  else mount();
  const options = [...document.querySelectorAll('[data-option]')];
  const showChoice = choice => {
    options.forEach((button,i)=>button.setAttribute('aria-pressed',i===choice));
    document.querySelector('#feedback').textContent = (choice===l.correct?'맞았어요. ':'이렇게 알아두세요. ') + l.explain;
  };
  if (Number.isInteger(records[index]?.choice)) showChoice(records[index].choice);
  options.forEach((button,i)=>button.onclick=()=>{update(index,{choice:i});showChoice(i);});
  const answer = document.querySelector('#answer');
  const status = document.querySelector('#saved');
  const complete = document.querySelector('#complete');
  answer.value = records[index]?.answer || '';
  if (records[index]?.done) complete.textContent = '학습 완료됨';
  answer.oninput = () => { if (!update(index,{answer:answer.value})) status.textContent = '이 브라우저에서 저장을 사용할 수 없어요.'; };
  complete.onclick = () => {
    const saved = update(index,{answer:answer.value,done:true});
    complete.textContent = '학습 완료됨';
    status.textContent = saved?'완료 표시와 내 생각을 이 브라우저에 저장했어요.':'이 브라우저에서 저장을 사용할 수 없어요.';
  };
}
function render() {
  const route = location.hash.slice(1);
  const match = /^lesson-([1-6])$/.exec(route);
  if (match) lesson(Number(match[1])-1);
  else if (route==='timeline') app.innerHTML = `<section class="panel"><h1 tabindex="-1">시대 흐름</h1><ol class="timeline">${timeline.map(([year,event,desc,index])=>`<li><strong>${year}년 · ${event}</strong><p>${desc}</p>${index ? `<a href="#lesson-${index}">관련 챕터 열기</a>` : ""}</li>`).join('')}</ol></section>`;
  else if (route==='teacher') app.innerHTML = `<section class="panel"><h1 tabindex="-1">교사용 영상 검토</h1><p>공식 업로드와 회차를 확인한 영상입니다. 학생에게 공유하기 전에 실제 재생 환경에서 장면 전체 및 학교 기기 재생을 확인해 주세요.</p><ul>${lessons.map(l=>`<li><a href="${url(l.id)}" target="_blank" rel="noopener">${l.ep} · ${l.title}</a> — ${l.review?'교사 동반 권장 · '+l.review:'장면 전체와 재생 가능 여부 확인 필요'}</li>`).join('')}</ul></section>`;
  else app.innerHTML = `<section class="hero"><p class="stamp">초등 사회 · 자기주도 역사 탐구</p><h1 tabindex="-1">장면으로 읽는<br>조선의 마지막 시기</h1><p>영상을 보기 전에 그 시대를 먼저 만나 보세요. 배경을 알고 보면 인물의 말과 행동이 다르게 보입니다.</p><a class="button" href="#lesson-${(lessons.findIndex((_,i)=>!records[i]?.done)+1)||1}">학습 시작</a></section><section class="heading" id="chapters" tabindex="-1">${cards()}</section>`;
  const focus = route==='chapters'? document.querySelector('#chapters'):app.querySelector('h1');
  if(route) focus?.focus({preventScroll:true});
  if(route==='chapters') focus?.scrollIntoView(); else window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
</body></html>
